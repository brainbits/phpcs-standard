# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Release"

# Runs after a successful "Build" of a push to main, so failing tests never get released.
on:
  workflow_run:
    workflows:
      - "Build"
    types:
      - "completed"
    branches:
      - "main"

permissions:
  contents: "write"
  issues: "write"
  pull-requests: "write"

jobs:
  release:
    name: "Create Release"

    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    runs-on: "ubuntu-latest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          ref: "${{ github.event.workflow_run.head_sha }}"
          fetch-depth: 0

      - name: "Install Node"
        uses: "actions/setup-node@v4"
        with:
          node-version: "lts/*"

      - name: "Run semantic-release"
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: "npx semantic-release@25.0.9"
